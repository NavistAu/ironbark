# This is an example/dogfood Woodpecker pipeline for Woodpecker users who
# want a reference config — it is NOT ironbark's project CI, which runs on
# GitHub Actions (.github/workflows/). It contains no infrastructure
# identifiers: the publish step's registry host, repo path, and
# credentials all come from Woodpecker secrets (from_secret), so it runs
# unmodified on any Woodpecker instance that supplies them.

when:
  # `manual` admitted deliberately: the estate forge copy is a pull
  # mirror whose sync does not always fire a push webhook, so operator-
  # triggered API pipelines are the fallback build path (2026-08-19).
  - event: [push, pull_request, manual]

steps:
  vet:
    image: golang:1.24
    commands:
      - go vet ./...

  test:
    image: golang:1.24
    commands:
      # Fast unit suite only. Integration tests (`-tags integration`) need
      # docker-in-docker/service containers (Vault, etc.) and run in a
      # separate pipeline/job, not here.
      - go test ./...

  build:
    image: golang:1.24
    commands:
      # Sanity compile only; the published binary is version-stamped
      # separately below (-ldflags "-X main.version=$(cat VERSION)").
      - go build ./...

  publish:
    image: golang:1.24
    environment:
      # Registry host, repo path, and credentials are all instance-supplied
      # secrets — this file names no registry (DEC-0014).
      REGISTRY_HOST:
        from_secret: registry_host
      REGISTRY_REPO:
        from_secret: registry_repo
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_TOKEN:
        from_secret: registry_token
      # Must track the Dockerfile's runtime base (Stage 2 FROM line). A
      # public value (the base image is publicly pulled), so it stays
      # hardcoded rather than a secret.
      KO_DEFAULTBASEIMAGE: gcr.io/distroless/static-debian12:nonroot
    commands:
      # Pinned to v0.18.0: v0.19.1 requires go>=1.26.3, but this step runs
      # on golang:1.24 with GOTOOLCHAIN=local, so it can't auto-fetch a
      # newer toolchain. Bumping ko past v0.18.x requires bumping this
      # step's image in lockstep.
      - go install github.com/google/ko@v0.18.0
      # VERSION feeds .ko.yaml's ldflags template (-X main.version=...),
      # the same injection the Dockerfile build stage performs.
      - export VERSION=$(cat VERSION)
      - export KO_DOCKER_REPO="$REGISTRY_REPO"
      - echo "$REGISTRY_TOKEN" | ko login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
      - ko build ./cmd/ironbark --bare --tags "$CI_COMMIT_SHA" --image-refs /tmp/image-ref.txt
      - cat /tmp/image-ref.txt
    when:
      - branch: main
        event: [push, manual]
